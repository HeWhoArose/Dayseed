<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290" role="img" aria-labelledby="title desc">
  <title id="title">Dayseed Today screen comparison: W1 Action-first, W2 Reflective, W3 Compact effort controls</title>
  <desc id="desc">Three matching Android portrait phone mockups compare alternative Today screen hierarchies with identical synthetic habit data. This is a planning prototype, not implemented UI.</desc>
  <defs>
    <style>
      .ink{fill:#272923}.muted{fill:#6d7167}.faint{fill:#98998e}.sage{fill:#dfe7d8}.sageInk{fill:#4e6248}.terra{fill:#b86f56}.paper{fill:#f8f6ef}.rule{stroke:#d9d7cc;stroke-width:1.5}.h1{font-family:Georgia,'Times New Roman',serif;font-size:38px;fill:#272923}.h2{font-family:Arial,sans-serif;font-size:23px;font-weight:700;fill:#272923}.body{font-family:Arial,sans-serif;font-size:18px;fill:#272923}.small{font-family:Arial,sans-serif;font-size:14px;fill:#6d7167;letter-spacing:1.4px}.tiny{font-family:Arial,sans-serif;font-size:15px;fill:#6d7167}.buttonText{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#3c4935}.nav{font-family:Arial,sans-serif;font-size:14px;fill:#62665b}.label{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#272923}.sub{font-family:Arial,sans-serif;font-size:16px;fill:#6d7167}
    </style>
