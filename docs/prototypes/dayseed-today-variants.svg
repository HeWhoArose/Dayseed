  <rect width="1800" height="1290" fill="#f1eee5"/>
  <text x="48" y="58" class="h1" style="font-size:42px">Dayseed · Today layout comparison</text>
  <text x="50" y="94" class="sub">Planning prototype • identical synthetic data • visual hierarchy is not approved</text>
  <rect x="1472" y="35" width="280" height="66" rx="12" fill="#e3e9dc" stroke="#cdd7c4"/>
  <text x="1493" y="62" class="body" style="font-size:16px;font-weight:700;fill:#4e6248">PLANNING ONLY</text>
  <text x="1493" y="83" class="tiny" style="font-size:13px">No application UI changed</text>

  <!-- Variant titles -->
  <text x="48" y="142" class="label">W1 · Action-first</text>
  <text x="48" y="165" class="sub">Fast logging leads; reflection stays secondary.</text>
  <text x="648" y="142" class="label">W2 · Reflective</text>
  <text x="648" y="165" class="sub">A gentle note invitation appears earlier.</text>
  <text x="1248" y="142" class="label">W3 · Compact controls</text>
  <text x="1248" y="165" class="sub">Less always-visible control detail.</text>

