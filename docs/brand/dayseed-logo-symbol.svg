<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <title>Dayseed — Symbol Mark</title>
  <desc>Original Dayseed emblem: a cohesive seed opening at its crown with an emerging asymmetric two-leaf sprout above an open horizon curve.</desc>

  <!-- 1. Open Horizon / Day-Cycle Cradle Arc (Warm Terracotta-Earth #AC5530) -->
  <!-- Spans only the lower cradle beneath the seed; tapered open ends prevent any progress-ring reading. -->
  <path
    id="horizon-arc"
    fill="#AC5530"
    d="M 50 172
       C 47 169, 51 164, 56 167
       C 78 184, 98 192, 120 192
       C 142 192, 162 184, 184 167
       C 189 164, 193 169, 190 172
       C 168 195, 145 206, 120 206
       C 95 206, 72 195, 50 172 Z" />

  <!-- 2. Cohesive Opening Seed Body (#24352B) -->
  <!-- Whole rounded seed base parting organically at its upper crown to release the sprout -->
  <path
    id="opening-seed-body"
    fill="#24352B"
    d="M 120 184
       C 90 184, 72 165, 72 140
       C 72 124, 82 110, 96 108
       C 103 107, 108 112, 109 120
       C 111 134, 114 148, 120 148
       C 126 148, 129 134, 131 120
       C 132 112, 137 107, 144 108
       C 158 110, 168 124, 168 140
       C 168 165, 150 184, 120 184 Z" />

  <!-- 3. Secondary Young Leaf — Left Unfurling Leaf (#558B6E) -->
  <!-- Smaller, lower leaf expressing new beginnings and natural organic asymmetry -->
  <path
    id="sprout-leaf-left"
    fill="#558B6E"
    d="M 108 101
       C 86 101, 68 88, 60 68
       C 58 64, 61 60, 66 61
       C 88 63, 104 76, 110 95
       C 111 99, 110 101, 108 101 Z" />

  <!-- 4. Primary Rising Sprout Stem & Right Leaf (#286143) -->
  <!-- Central stem emerging directly from the seed cleft and sweeping smoothly into the primary leaf -->
  <path
    id="sprout-stem-and-primary-leaf"
    fill="#286143"
    d="M 115 138
       C 115 112, 117 88, 125 68
       C 135 45, 156 34, 178 34
       C 182 34, 184 37, 183 41
       C 177 70, 158 92, 133 99
       C 127 101, 125 106, 125 114
       L 125 138
       C 125 143, 115 143, 115 138 Z" />
</svg>
