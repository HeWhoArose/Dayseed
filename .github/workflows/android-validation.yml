name: Android validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-validation:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate an ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run JVM and Robolectric regression tests
        run: gradle --no-daemon :app:testDebugUnitTest --rerun-tasks

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayseed-android-validation-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
